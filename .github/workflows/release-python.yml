name: Release Python

# Builds abi3 (CPython >= 3.10) wheels for every supported platform plus an
# sdist, then publishes them to PyPI with trusted publishing (OIDC). Configure
# the PyPI project with this repository, workflow `release-python.yml` and
# environment `pypi`; no API token is needed.
#
# Wheels are built for the baseline ISA of each target (no target-cpu=native),
# the SIMD kernels pick AVX2 / AVX-512 at runtime.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --strip --out dist
          # hf-hub pulls in native-tls -> openssl-sys on Linux.
          before-script-linux: |
            if command -v dnf >/dev/null; then dnf install -y openssl-devel perl-IPC-Cmd;
            elif command -v yum >/dev/null; then yum install -y openssl-devel;
            elif command -v apt-get >/dev/null; then apt-get update && apt-get install -y libssl-dev pkg-config; fi
      - name: Smoke-test import
        # Cross-built macOS x86_64 wheels cannot be imported on the arm64 host.
        if: matrix.name != 'macos-x86_64'
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist xor-net
          cd "$RUNNER_TEMP"
          python -c "import xor_net; print('import OK', xor_net.__file__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xor-net
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
